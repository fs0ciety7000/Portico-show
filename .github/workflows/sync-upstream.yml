# Keeps the site in step with the Portico repository: latest release, install
# commands, phase statuses, tests and roadmap (scripts/sync-upstream.mjs), and
# the Arch Linux PKGBUILDs of that release (scripts/render-arch.sh).
# When the snapshot changes it is committed to main, and Coolify redeploys the
# site on that push. Nothing else is touched.
name: Sync with Portico

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  # Lets the Portico release workflow ask for an immediate sync (optional).
  repository_dispatch:
    types: [portico-release]

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Read the Portico repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sync-upstream.mjs
      - name: Render the Arch Linux PKGBUILDs
        run: bash scripts/render-arch.sh
      - name: Commit the new snapshot
        run: |
          if [ -z "$(git status --porcelain src/data public/arch)" ]; then echo "nothing changed"; exit 0; fi
          version=$(node -p "require('./src/data/upstream.json').release?.tag ?? 'unknown'")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data public/arch
          git commit -m "chore(data): sync with Portico ${version}"
          git push origin HEAD:main
